<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title description">
  <title id="title">Md. Tanvir Ahamed - Junior SQA Engineer</title>
  <desc id="description">An animated quality assurance network featuring API, Playwright, Jira, and CI/CD nodes.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="80%">
      <stop offset="0" stop-color="#10233b" />
      <stop offset="1" stop-color="#070b13" />
    </radialGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop stop-color="#438bff" stop-opacity=".12" />
      <stop offset=".5" stop-color="#39d9e7" stop-opacity=".55" />
      <stop offset="1" stop-color="#438bff" stop-opacity=".12" />
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7ca4ce" stroke-opacity=".07" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="960" height="360" rx="8" fill="url(#background)" />
  <rect width="960" height="360" rx="8" fill="url(#grid)" />

  <g fill="none" stroke="url(#edge)" stroke-width="1.2">
    <path d="M150 105 330 82 500 115 700 86 820 136" />
    <path d="M150 105 250 240 430 270 610 230 820 136" />
    <path d="M330 82 430 175 500 115 610 230 700 86" />
    <path d="M250 240 430 175 430 270 610 230" />
    <path d="M150 105 430 175 820 136" />
  </g>

  <g fill="#69a7ff" filter="url(#glow)">
    <circle r="2.5"><animateMotion dur="4s" repeatCount="indefinite" path="M150 105 330 82 500 115 700 86 820 136" /></circle>
    <circle r="2"><animateMotion dur="5s" repeatCount="indefinite" path="M820 136 610 230 430 270 250 240" /></circle>
    <circle r="2.4" fill="#39d9e7"><animateMotion dur="4.5s" repeatCount="indefinite" path="M150 105 430 175 820 136" /></circle>
    <circle r="1.8" fill="#39d9e7"><animateMotion dur="5.5s" repeatCount="indefinite" path="M250 240 430 175 500 115 700 86" /></circle>
  </g>

  <g font-family="Menlo,Monaco,monospace" text-anchor="middle">
    <g transform="translate(150 105)">
      <circle r="37" fill="#0b1728" stroke="#438bff" stroke-opacity=".7" />
      <circle r="41" fill="none" stroke="#438bff" stroke-opacity=".22"><animate attributeName="r" values="38;48;38" dur="3s" repeatCount="indefinite" /></circle>
      <text y="-2" fill="#8dbbff" font-size="12" font-weight="700">API</text><text y="13" fill="#8293aa" font-size="8">REST / JSON</text>
    </g>
    <g transform="translate(330 82)">
      <circle r="34" fill="#0b1728" stroke="#39d9e7" stroke-opacity=".7" />
      <text y="-2" fill="#6ee7ef" font-size="11" font-weight="700">TEST</text><text y="13" fill="#8293aa" font-size="8">Playwright</text>
    </g>
    <g transform="translate(700 86)">
      <circle r="35" fill="#0b1728" stroke="#438bff" stroke-opacity=".7" />
      <text y="-2" fill="#8dbbff" font-size="11" font-weight="700">BUG</text><text y="13" fill="#8293aa" font-size="8">Jira Track</text>
    </g>
    <g transform="translate(820 136)">
      <circle r="36" fill="#0b1728" stroke="#438bff" stroke-opacity=".7" />
      <text y="-2" fill="#8dbbff" font-size="10" font-weight="700">ASSERT</text><text y="13" fill="#8293aa" font-size="8">Strict Equal</text>
    </g>
    <g transform="translate(610 230)">
      <circle r="36" fill="#0b1728" stroke="#39d9e7" stroke-opacity=".7" />
      <text y="-2" fill="#6ee7ef" font-size="11" font-weight="700">QA</text><text y="13" fill="#8293aa" font-size="8">Automation</text>
    </g>
    <g transform="translate(250 240)">
      <circle r="38" fill="#0b1728" stroke="#438bff" stroke-opacity=".7" />
      <text y="-2" fill="#8dbbff" font-size="10" font-weight="700">CI / CD</text><text y="13" fill="#8293aa" font-size="8">GitHub Actions</text>
    </g>
  </g>

  <g font-family="Menlo,Monaco,monospace">
    <text x="480" y="168" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">MD. TANVIR AHAMED</text>
    <text x="480" y="190" text-anchor="middle" fill="#9db0c8" font-size="10" letter-spacing="1">JUNIOR SQA ENGINEER  /  MANUAL · API · AUTOMATION</text>
    <circle cx="407" cy="216" r="4" fill="#4ade80"><animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite" /></circle>
    <text x="480" y="220" text-anchor="middle" fill="#86efac" font-size="9">34 / 34 TESTS PASSED</text>
    <text x="22" y="336" fill="#76869b" font-size="9">PLAYWRIGHT  ·  POSTMAN  ·  NEWMAN</text>
    <text x="938" y="336" text-anchor="end" fill="#76869b" font-size="9">QUALITY IN EVERY RELEASE</text>
  </g>
</svg>